[package]
name = "sp-emu"
version = "0.0.1"
edition = "2021"
default-run = "sp-emu"
description = "Native-Rust Cortex-M emulator for booting Oxide Hubris on emulated SPs/RoTs"

[dependencies]
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.4"
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["bzip2", "deflate"] }
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true
lto = true
codegen-units = 1
